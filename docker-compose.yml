services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: fipe
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://app:app@database:3306/fipe?serverVersion=8.0&charset=utf8mb4"
      ADMIN_EMAIL: admin@pigz.com
      ADMIN_PASSWORD: admin123
      SEED_DEMO: "1"
    volumes:
      - ./:/var/www/app
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  db_data: